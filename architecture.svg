<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565C0"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Amazon S3 Vectors RAG Pipeline (us-east-1)</text>

  <!-- ================= INGESTION (green, top) ================= -->
  <text x="150" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">INGESTION (run once per document set)</text>

  <!-- Documents -->
  <rect x="70" y="90" width="150" height="80" rx="6" fill="#F2F5F7" stroke="#879196" stroke-width="1.5"/>
  <text x="145" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Documents</text>
  <text x="145" y="146" text-anchor="middle" font-size="11" fill="#5A6B77">.md / .txt</text>

  <!-- Embedding (Bedrock) -->
  <rect x="400" y="90" width="150" height="80" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="475" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Amazon Bedrock</text>
  <text x="475" y="139" text-anchor="middle" font-size="11" fill="#232F3E">Titan Text Embeddings v2</text>
  <text x="475" y="155" text-anchor="middle" font-size="10" fill="#5A6B77">(embedding model)</text>

  <!-- S3 Vectors -->
  <rect x="740" y="90" width="150" height="80" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="815" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Amazon S3 Vectors</text>
  <text x="815" y="144" text-anchor="middle" font-size="10" fill="#5A6B77">1024-dim, cosine</text>

  <!-- Ingestion arrows -->
  <line x1="220" y1="130" x2="395" y2="130" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="307" y="122" text-anchor="middle" font-size="11" fill="#2E7D32">1. Chunked and embedded</text>

  <line x1="550" y1="130" x2="735" y2="130" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="642" y="122" text-anchor="middle" font-size="11" fill="#2E7D32">2. Vectors written to index</text>

  <!-- ================= QUERY (blue, bottom, through APP) ================= -->
  <text x="150" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">QUERY (per question, orchestrated by the app)</text>

  <!-- User -->
  <circle cx="145" cy="470" r="20" fill="#F2F5F7" stroke="#879196" stroke-width="1.5"/>
  <circle cx="145" cy="463" r="7" fill="#879196"/>
  <path d="M131,483 q14,-16 28,0" fill="#879196"/>
  <text x="145" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">User</text>

  <!-- APP hub -->
  <rect x="360" y="435" width="170" height="80" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="2"/>
  <text x="445" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">RAG application</text>
  <text x="445" y="486" text-anchor="middle" font-size="10.5" fill="#5A6B77">query.py / app.py</text>
  <text x="445" y="501" text-anchor="middle" font-size="10" fill="#5A6B77">(orchestrator)</text>

  <!-- LLM (Bedrock generation) -->
  <rect x="740" y="435" width="150" height="80" rx="6" fill="#E3F0FB" stroke="#1565C0" stroke-width="1.5"/>
  <text x="815" y="463" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Amazon Bedrock</text>
  <text x="815" y="480" text-anchor="middle" font-size="11" fill="#232F3E">foundation model</text>
  <text x="815" y="496" text-anchor="middle" font-size="10" fill="#5A6B77">Converse (generation)</text>

  <!-- User <-> APP -->
  <line x1="167" y1="463" x2="355" y2="463" stroke="#1565C0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="261" y="456" text-anchor="middle" font-size="11" fill="#1565C0">1. Asks question</text>
  <line x1="355" y1="487" x2="167" y2="487" stroke="#1565C0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="261" y="502" text-anchor="middle" font-size="11" fill="#1565C0">5. Grounded answer returns</text>

  <!-- APP <-> Embedding (vertical up) -->
  <line x1="430" y1="435" x2="430" y2="172" stroke="#1565C0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="372" y="300" text-anchor="middle" font-size="11" fill="#1565C0">2. Embed the</text>
  <text x="372" y="314" text-anchor="middle" font-size="11" fill="#1565C0">question</text>
  <line x1="460" y1="172" x2="460" y2="435" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <text x="533" y="300" text-anchor="middle" font-size="10" fill="#5A6B77">query vector back</text>

  <!-- APP <-> S3 Vectors -->
  <line x1="530" y1="455" x2="812" y2="172" stroke="#1565C0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="662" y="296" text-anchor="middle" font-size="11" fill="#1565C0" transform="rotate(-38 662 296)">3. Search by meaning</text>
  <line x1="835" y1="172" x2="560" y2="452" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <text x="742" y="330" text-anchor="middle" font-size="10" fill="#5A6B77" transform="rotate(-38 742 330)">nearest chunks back</text>

  <!-- APP <-> LLM -->
  <line x1="530" y1="463" x2="735" y2="463" stroke="#1565C0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="632" y="456" text-anchor="middle" font-size="11" fill="#1565C0">4. Chunks as context</text>
  <line x1="735" y1="487" x2="535" y2="487" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <text x="635" y="502" text-anchor="middle" font-size="10" fill="#5A6B77">grounded answer back</text>

  <!-- note -->
  <text x="480" y="545" text-anchor="middle" font-size="10.5" fill="#879196">Solid = request, dashed = response.</text>
</svg>